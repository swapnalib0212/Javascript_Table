<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monogram-Table</title>
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body>
     <h2>Product List</h2>
     <input type="text"   id="searchInput" placeholder="Search products"/>

     
     <label for="itemsPerPageSelect">ItemsPerPage</label>
     <select id="itemsPerPageSelect">
     <option value="3">3</option>
     <option value="5">5</option>
     <option value="10">10</option>
     <option value="15">15</option>
     </select>


    





     <select id = "statusFilter"  onchange="myFilter()">
        <option value="all">Status: All</option>
        <option value="Available">Available</option>
        <option value="Sold Out">Sold Out</option>
     </select>
     

     <select id ="rateFilter" onchange="PFilter()"> 

     <option value="Price:Low to High">Sort By :Price:Low to High</option>
     <option value="Price:High to Low">Sort By :Price:High to Low</option>
     <option value="Newest Arrival">Sort By :Newest Arrival</option>
     <option value="Best Seller">Sort By :Best Seller</option>
     </select>
     <table id="productTable" width = "100%" border = "2">
        <thead>
         <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Status</th>
            <th>Rating</th>
         </tr>
        </thead>
     
    
        <tbody>
      
        </tbody>
      </table> 
      <div id="pagination">
        <ul class="pagination">
            
        </ul>
      </div>


      <div id = "Division" style ="background-color: burlywood; width: 100%;  height: 100px;" >
        This is my website
      </div>
      <button  id="btn">submit</button>

     <script src="script.js"></script>
</body>
</html>
